<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sarkari Yojana Eligibility Finder 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; padding: 20px; max-width: 700px; margin: 0 auto; }
    .back-btn { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: 600; }
    .card { background-color: #131c31; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    h1 { color: #818cf8; font-size: 1.8rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; color: #f8fafc; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    select, input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0b1120; color: #fff; font-size: 0.95rem; outline: none; }
    select:focus, input:focus { border-color: #818cf8; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; background-color: #818cf8; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #6366f1; }
    
    .results-container { margin-top: 25px; display: none; }
    .results-header { color: #38bdf8; font-size: 1.3rem; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
    .scheme-card { background-color: #0b1120; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .scheme-card h3 { color: #818cf8; font-size: 1.1rem; margin-bottom: 6px; }
    .scheme-card p { color: #94a3b8; font-size: 0.88rem; margin-bottom: 8px; line-height: 1.4; }
    .badge { display: inline-block; background-color: #1e293b; color: #38bdf8; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
  </style>
</head>
<body>

  <a href="/index.html" class="back-btn">← Back to Home</a>

  <div class="card">
    <h1>Sarkari Yojana Finder</h1>
    <p>Apni details enter karein aur jaanein aap kin-kin Government Schemes ke liye eligible hain.</p>

    <div class="form-group">
      <label for="age">Aapki Age (Years):</label>
      <input type="number" id="age" placeholder="e.g. 25" min="1" max="100">
    </div>

    <div class="form-group">
      <label for="occupation">Aapka Business / Occupation:</label>
      <select id="occupation">
        <option value="farmer">Farmer (Kisan)</option>
        <option value="student">Student</option>
        <option value="artisan">Artisan / Small Worker (Vishwakarma/Labor)</option>
        <option value="unemployed">Unemployed / Job Seeker</option>
        <option value="business">Small Business Owner / Self Employed</option>
      </select>
    </div>

    <div class="form-group">
      <label for="income">Annual Family Income (₹ per year):</label>
      <select id="income">
        <option value="below2.5">Below ₹2.5 Lakhs</option>
        <option value="2.5to5">₹2.5 Lakhs to ₹5 Lakhs</option>
        <option value="above5">Above ₹5 Lakhs</option>
      </select>
    </div>

    <button onclick="findSchemes()">Find Eligible Schemes</button>
  </div>

  <div class="results-container" id="resultsContainer">
    <h2 class="results-header" id="resultsTitle">Matching Schemes for You</h2>
    <div id="schemesList"></div>
  </div>

  <footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #1e293b; text-align: center; color: #94a3b8; font-size: 0.85rem;">
    <div style="margin-bottom: 12px;">
      <button onclick="shareApp()" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 600;">🔗 Share Page</button>
    </div>
    <div style="margin-bottom: 10px;">
      <a href="/privacy-policy.html" style="color: #94a3b8; text-decoration: none; margin: 0 8px;">Privacy Policy</a> |
      <a href="/terms.html" style="color: #94a3b8; text-decoration: none; margin: 0 8px;">Terms of Service</a> |
      <a href="/disclaimer.html" style="color: #94a3b8; text-decoration: none; margin: 0 8px;">Disclaimer</a>
    </div>
    <p>© 2026 All-in-One Utility Portal. All Rights Reserved.</p>
  </footer>

  <script>
    const schemesDB = [
      {
        id: "pmkisan",
        title: "🏛️ PM Kisan Samman Nidhi",
        desc: "Financial benefit of ₹6,000 per year in 3 equal installments directly into bank accounts of land-holding farmer families.",
        occupations: ["farmer"],
        minAge: 18,
        incomeMax: ["below2.5", "2.5to5", "above5"],
        docs: "Aadhaar Card, Land Ownership Papers, Bank Passbook"
      },
      {
        id: "pmawas",
        title: "🏠 PM Awas Yojana (PMAY)",
        desc: "Financial assistance and interest subsidy for constructing or purchasing a permanent pucca house.",
        occupations: ["farmer", "artisan", "unemployed", "business", "student"],
        minAge: 18,
        incomeMax: ["below2.5", "2.5to5"],
        docs: "Aadhaar, Income Certificate, Ration Card, Bank Account"
      },
      {
        id: "ayushman",
        title: "🏥 Ayushman Bharat PM-JAY",
        desc: "Health insurance cover up to ₹5 Lakh per family per year for secondary and tertiary hospitalization care.",
        occupations: ["farmer", "artisan", "unemployed", "business", "student"],
        minAge: 1,
        incomeMax: ["below2.5", "2.5to5"],
        docs: "Ration Card, E-Shram Card / Aadhaar"
      },
      {
        id: "vishwakarma",
        title: "🔨 PM Vishwakarma Yojana",
        desc: "Collateral-free enterprise development loans up to ₹3 Lakhs at 5% interest + ₹15,000 toolkit digital incentive for traditional artisans.",
        occupations: ["artisan"],
        minAge: 18,
        incomeMax: ["below2.5", "2.5to5", "above5"],
        docs: "Trade Skill proof, Aadhaar Card, Bank Details"
      },
      {
        id: "mudra",
        title: "💼 PM Mudra Yojana Loan",
        desc: "Loans up to ₹10 Lakhs for non-corporate, non-farm small/micro enterprises without collateral.",
        occupations: ["business", "artisan", "unemployed"],
        minAge: 18,
        incomeMax: ["below2.5", "2.5to5", "above5"],
        docs: "Business Plan, Identity Proof, Bank Statement"
      },
      {
        id: "pmvidya",
        title: "🎓 PM Vidya Lakshmi Education Loan",
        desc: "Single window portal for students to apply for educational loans and government scholarships.",
        occupations: ["student"],
        minAge: 15,
        incomeMax: ["below2.5", "2.5to5", "above5"],
        docs: "10th/12th Marksheet, Admission Letter, Parent Income Certificate"
      }
    ];

    function findSchemes() {
      const ageVal = parseInt(document.getElementById('age').value);
      const occupation = document.getElementById('occupation').value;
      const income = document.getElementById('income').value;

      if (isNaN(ageVal) || ageVal < 1) {
        alert('Please enter a valid age');
        return;
      }

      const eligible = schemesDB.filter(s => {
        const matchesAge = ageVal >= s.minAge;
        const matchesOcc = s.occupations.includes(occupation);
        const matchesInc = s.incomeMax.includes(income);
        return matchesAge && matchesOcc && matchesInc;
      });

      const listDiv = document.getElementById('schemesList');
      listDiv.innerHTML = '';

      if (eligible.length === 0) {
        listDiv.innerHTML = '<p style="color: #94a3b8;">No specific matching schemes found for the selected criteria. Try adjusting income or occupation.</p>';
      } else {
        eligible.forEach(s => {
          listDiv.innerHTML += `
            <div class="scheme-card">
              <h3>${s.title}</h3>
              <p>${s.desc}</p>
              <span class="badge">Required Docs: ${s.docs}</span>
            </div>
          `;
        });
      }

      document.getElementById('resultsContainer').style.display = 'block';
      document.getElementById('resultsContainer').scrollIntoView({ behavior: 'smooth' });
    }

    function shareApp() {
      if (navigator.share) {
        navigator.share({ title: document.title, url: window.location.href }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Page link copied to clipboard!');
      }
    }
  </script>

</body>
</html>
