<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>सरकारी योजना पात्र जिला अनुसार (State & District Wise Portal)</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6QZWH8C69J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6QZWH8C69J');
  </script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0f172a; color: #fff; max-width: 600px; margin: 0 auto; }
    select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; font-size: 16px; }
    button { background: #38bdf8; font-weight: bold; cursor: pointer; color: #000; }
    .card { background: #1e293b; padding: 15px; border-radius: 6px; margin-top: 15px; border-left: 4px solid #38bdf8; }
    .badge { background: #22c55e; color: #000; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .related-section { margin-top: 30px; background: #1e293b; padding: 15px; border-radius: 8px; }
    .related-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip { background: #334155; color: #38bdf8; padding: 8px 12px; border-radius: 20px; text-decoration: none; font-size: 14px; cursor: pointer; border: 1px solid #475569; }
    .chip:hover { background: #38bdf8; color: #000; }
  </style>
</head>
<body>
  <h2>🏛️ राज्य व जिला अनुसार सरकारी योजना की जानकारी</h2>
  <p style="color:#94a3b8; font-size: 14px;">अपने जिले और राज्य के अनुसार सभी पात्र योजनाओं की सूची देखें।</p>
  
  <label>राज्य चुनें (Select State):</label>
  <select id="state" onchange="loadDistricts()">
    <option value="">-- State Choose Karein --</option>
    <option value="MP">Madhya Pradesh</option>
    <option value="UP">Uttar Pradesh</option>
    <option value="BR">Bihar</option>
    <option value="RJ">Rajasthan</option>
  </select>

  <label>जिला चुनें (Select District):</label>
  <select id="district">
    <option value="">-- Pehle State Choose Karein --</option>
  </select>

  <button onclick="showSchemes()">योजनाएं खोजें (Search Schemes)</button>

  <div id="results"></div>

  <!-- Related Options Feature (Internal Linking) -->
  <div class="related-section">
    <h3>📌 Related Options / Other Districts</h3>
    <p style="color:#94a3b8; font-size: 13px;">Popular searches in your region:</p>
    <div class="related-links" id="relatedBox">
      <span class="chip" onclick="quickSelect('MP','Satna')">Satna (MP)</span>
      <span class="chip" onclick="quickSelect('MP','Bhopal')">Bhopal (MP)</span>
      <span class="chip" onclick="quickSelect('UP','Lucknow')">Lucknow (UP)</span>
      <span class="chip" onclick="quickSelect('UP','Prayagraj')">Prayagraj (UP)</span>
      <span class="chip" onclick="quickSelect('BR','Patna')">Patna (Bihar)</span>
    </div>
  </div>

  <script>
    const data = {
      MP: ["Bhopal", "Indore", "Satna", "Jabalpur", "Gwalior", "Rewa"],
      UP: ["Lucknow", "Kanpur", "Varanasi", "Prayagraj", "Agra", "Gorakhpur"],
      BR: ["Patna", "Gaya", "Muzaffarpur", "Bhagalpur"],
      RJ: ["Jaipur", "Jodhpur", "Udaipur", "Kota"]
    };

    function loadDistricts() {
      const st = document.getElementById('state').value;
      const distSelect = document.getElementById('district');
      distSelect.innerHTML = '<option value="">-- District Choose Karein --</option>';
      if(st && data[st]) {
        data[st].forEach(d => {
          distSelect.innerHTML += `<option value="${d}">${d}</option>`;
        });
      }
    }

    function quickSelect(st, dist) {
      document.getElementById('state').value = st;
      loadDistricts();
      document.getElementById('district').value = dist;
      showSchemes();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showSchemes() {
      const st = document.getElementById('state').value;
      const dist = document.getElementById('district').value;
      const res = document.getElementById('results');
      
      if(!st || !dist) {
        res.innerHTML = '<p style="color:#ef4444;">Kripya State aur District dono select karein!</p>';
        return;
      }

      res.innerHTML = `
        <div class="card">
          <h3><span class="badge">ACTIVE</span> लाडली बहना / राज्य सहायता योजना - ${dist} (${st})</h3>
          <p>पात्रता: 21-60 वर्ष, वार्षिक आय 2.5 लाख से कम। ${dist} जिला कार्यालय में आवेदन जारी हैं।</p>
        </div>
        <div class="card">
          <h3><span class="badge">ACTIVE</span> पीएम आवास योजना (ग्रामीण/शहरी) - ${dist}</h3>
          <p>${dist} जिले के पात्र लाभार्थियों की नई सूची जारी।</p>
        </div>
      `;

      // Related Links Auto Update Logic
      let relatedHTML = "";
      data[st].forEach(d => {
        if(d !== dist) {
          relatedHTML += `<span class="chip" onclick="quickSelect('${st}','${d}')">${d} (${st})</span> `;
        }
      });
      document.getElementById('relatedBox').innerHTML = relatedHTML;
    }
  </script>
</body>
</html>
