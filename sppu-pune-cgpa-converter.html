<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPPU Pune CGPA to Percentage Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        .card { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>SPPU Pune CGPA Converter</h2>
        <p>Official Formula: <strong>CGPA * 9.5</strong></p>
        <input type="number" id="cgpa" placeholder="Enter your CGPA (e.g. 8.5)" step="0.01">
        <button onclick="convert()">Calculate Percentage</button>
        <h3 id="result"></h3>
    </div>

    <script>
        function convert() {
            let cgpa = parseFloat(document.getElementById('cgpa').value);
            if(isNaN(cgpa)) { alert('Please enter valid CGPA'); return; }
            let multiplier = 9.5;
            let percentage = (cgpa * multiplier).toFixed(2);
            document.getElementById('result').innerText = "Percentage: " + percentage + "%";
        }
    </script>
</body>
</html>
