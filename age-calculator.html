<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exact Age Calculator - Calculate Age in Years, Months, Days</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TPS02BQ6B4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TPS02BQ6B4');
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8 max-w-xl mx-auto space-y-6">
    <a href="/" class="text-indigo-400 hover:underline">&larr; Back to Home</a>
    
    <header class="space-y-2">
        <h1 class="text-3xl font-extrabold text-indigo-400">Exact Age Calculator</h1>
        <p class="text-slate-400 text-sm">Enter Date of Birth to calculate exact age in years, months, and days.</p>
    </header>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
        <div>
            <label class="block text-sm mb-1 text-slate-300">Date of Birth (DD/MM/YYYY)</label>
            <input type="text" id="dob" placeholder="DD/MM/YYYY" maxlength="10" autocomplete="off" class="w-full bg-slate-700 border border-slate-600 rounded p-3 text-white text-lg tracking-widest text-center">
        </div>

        <div>
            <label class="block text-sm mb-1 text-slate-300">Target Date (Default Today)</label>
            <input type="date" id="target" class="w-full bg-slate-700 border border-slate-600 rounded p-3 text-white">
        </div>

        <button onclick="calcAge()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-semibold text-white transition">Calculate Age</button>
        <div id="age-res" class="hidden p-4 bg-slate-700 rounded-lg text-emerald-400 font-bold text-xl text-center"></div>
    </div>

    <script>
        document.getElementById('target').valueAsDate = new Date();

        const dobInput = document.getElementById('dob');
        dobInput.addEventListener('input', function(e) {
            let v = this.value.replace(/\D/g, '');
            if (v.length > 8) v = v.substring(0, 8);
            
            if (v.length > 4) {
                this.value = v.substring(0, 2) + '/' + v.substring(2, 4) + '/' + v.substring(4);
            } else if (v.length > 2) {
                this.value = v.substring(0, 2) + '/' + v.substring(2);
            } else {
                this.value = v;
            }
        });

        function calcAge() {
            const dobStr = document.getElementById('dob').value;
            const parts = dobStr.split('/');
            if (parts.length !== 3 || parts[2].length !== 4) {
                alert("Please enter DOB in DD/MM/YYYY format!");
                return;
            }

            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);

            const dob = new Date(year, month, day);
            const targetVal = document.getElementById('target').value;
            if(!targetVal) return;
            const target = new Date(targetVal);

            if (isNaN(dob.getTime())) {
                alert("Invalid Date!");
                return;
            }

            let y = target.getFullYear() - dob.getFullYear();
            let m = target.getMonth() - dob.getMonth();
            let d = target.getDate() - dob.getDate();

            if (d < 0) {
                m--;
                d += new Date(target.getFullYear(), target.getMonth(), 0).getDate();
            }
            if (m < 0) {
                y--;
                m += 12;
            }

            const r = document.getElementById('age-res');
            r.classList.remove('hidden');
            r.innerText = `${y} Years, ${m} Months, ${d} Days`;
        }
    </script>

<footer class="mt-8 pt-4 border-t border-slate-800 text-center text-xs text-slate-500 space-x-4">
    <a href="/about.html" class="hover:underline">About Us</a>
    <a href="/privacy-policy.html" class="hover:underline">Privacy Policy</a>
    <a href="/terms.html" class="hover:underline">Terms & Conditions</a>
</footer>

</body>
</html>
