<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exact Age Calculator - Exam & Job Eligibility</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    .back-btn { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: 600; }
    .card { background-color: #131c31; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; }
    h1 { color: #818cf8; font-size: 1.8rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }
    label { display: block; color: #f8fafc; margin-bottom: 8px; font-weight: 600; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0b1120; color: #fff; font-size: 1rem; margin-bottom: 20px; outline: none; }
    input:focus { border-color: #818cf8; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; background-color: #818cf8; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { background-color: #6366f1; }
    .result { margin-top: 20px; padding: 16px; background-color: #0b1120; border-radius: 8px; border: 1px solid #334155; display: none; text-align: center; }
    .result h2 { color: #38bdf8; font-size: 1.4rem; margin-top: 5px; }
  </style>
</head>
<body>

  <a href="/index.html" class="back-btn">← Back to Home</a>

  <div class="card">
    <h1>Exact Age Calculator</h1>
    <p>Calculate exact age in years, months, and days for exam forms & job applications.</p>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob">

    <label for="targetDate">Calculate Age As Of Date:</label>
    <input type="date" id="targetDate">

    <button onclick="calculateAge()">Calculate Age</button>

    <div class="result" id="resultBox">
      <p style="color: #94a3b8; font-size: 0.9rem;">Your Exact Age is:</p>
      <h2 id="ageOutput">0 Years, 0 Months, 0 Days</h2>
    </div>
  </div>

  
<footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #1e293b; text-align: center; color: #94a3b8; font-size: 0.85rem;">
  <div style="margin-bottom: 12px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
    <button onclick="shareApp()" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 600;">🔗 Share Page</button>
  </div>
  <div style="margin-bottom: 10px;">
    <a href="/privacy-policy.html" style="color: #94a3b8; text-decoration: none; margin: 0 8px;">Privacy Policy</a> |
    <a href="/terms.html" style="color: #94a3b8; text-decoration: none; margin: 0 8px;">Terms of Service</a> |
    <a href="/disclaimer.html" style="color: #94a3b8; text-decoration: none; margin: 0 8px;">Disclaimer</a>
  </div>
  <p>© 2026 All-in-One Utility Portal. All Rights Reserved.</p>
</footer>

<script>
function shareApp() {
  if (navigator.share) {
    navigator.share({
      title: document.title,
      url: window.location.href
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert('Page link copied to clipboard!');
  }
}
</script>


  <script>
    // Set max allowed date (Current Date + 6 Months)
    let now = new Date();
    let maxAllowed = new Date(now.getFullYear(), now.getMonth() + 6, now.getDate());
    let maxStr = maxAllowed.toISOString().split('T')[0];
    let todayStr = now.toISOString().split('T')[0];

    document.getElementById('dob').setAttribute('max', maxStr);
    document.getElementById('targetDate').setAttribute('max', maxStr);
    document.getElementById('targetDate').value = todayStr;

    function calculateAge() {
      let dobVal = document.getElementById('dob').value;
      let targetVal = document.getElementById('targetDate').value;

      if (!dobVal || !targetVal) {
        alert('Please select both Date of Birth and Target Date');
        return;
      }

      let dob = new Date(dobVal);
      let target = new Date(targetVal);

      if (dob > maxAllowed || target > maxAllowed) {
        alert('Dates beyond 6 months from today are not allowed.');
        return;
      }

      if (dob > target) {
        alert('Date of Birth cannot be in the future of the Target Date!');
        return;
      }

      let years = target.getFullYear() - dob.getFullYear();
      let months = target.getMonth() - dob.getMonth();
      let days = target.getDate() - dob.getDate();

      if (days < 0) {
        months--;
        let lastMonth = new Date(target.getFullYear(), target.getMonth(), 0);
        days += lastMonth.getDate();
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      document.getElementById('ageOutput').innerText = `${years} Years, ${months} Months, ${days} Days`;
      document.getElementById('resultBox').style.display = 'block';
    }
  </script>

</body>
</html>
