<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA & Attendance Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 25px; max-width: 450px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; color: #cbd5e1; font-size: 0.85rem; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        button:hover { background: #0284c7; color: #fff; }
        .result { margin-top: 20px; padding: 12px; background: #0f172a; border-radius: 8px; color: #38bdf8; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Attendance Calculator</h1>
        <p>Calculate required classes for 75% target</p>
        <div class="input-group">
            <label>Total Classes Conducted</label>
            <input type="number" id="totalClasses" placeholder="e.g. 50">
        </div>
        <div class="input-group">
            <label>Classes Attended</label>
            <input type="number" id="attendedClasses" placeholder="e.g. 35">
        </div>
        <button onclick="calculateAttendance()">Calculate</button>
        <div class="result" id="resultBox"></div>
    </div>
    <script>
        function calculateAttendance() {
            let total = parseFloat(document.getElementById('totalClasses').value);
            let attended = parseFloat(document.getElementById('attendedClasses').value);
            let resultBox = document.getElementById('resultBox');
            if (!total || isNaN(attended) || attended > total) {
                resultBox.style.display = "block";
                resultBox.style.color = "#ef4444";
                resultBox.innerHTML = "Please enter valid numbers!";
                return;
            }
            let percentage = ((attended / total) * 100).toFixed(2);
            let message = `Current Attendance: ${percentage}%<br>`;
            if (percentage >= 75) {
                message += `<span style="color: #4ade80;">You are safe! Keep it up.</span>`;
            } else {
                let required = Math.ceil((0.75 * total - attended) / 0.25);
                message += `<span style="color: #f87171;">You need to attend ${required} more classes for 75%.</span>`;
            }
            resultBox.style.display = "block";
            resultBox.style.color = "#38bdf8";
            resultBox.innerHTML = message;
        }
    </script>
</body>
</html>
