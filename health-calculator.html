<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health & BMI Fitness Calculator</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6QZWH8C69J"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-6QZWH8C69J');</script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0f172a; color: #fff; max-width: 600px; margin: 0 auto; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; font-size: 16px; box-sizing: border-box; }
    button { background: #22c55e; font-weight: bold; cursor: pointer; color: #000; }
    .card { background: #1e293b; padding: 15px; border-radius: 6px; margin-top: 15px; border-left: 4px solid #22c55e; }
    .related-section { margin-top: 30px; background: #1e293b; padding: 15px; border-radius: 8px; }
    .chip { display: inline-block; background: #334155; color: #38bdf8; padding: 8px 12px; border-radius: 20px; text-decoration: none; font-size: 14px; margin: 4px; border: 1px solid #475569; }
  </style>
</head>
<body>
  <h2>🩺 Health & BMI Fitness Calculator</h2>
  <label>Height (in cm):</label>
  <input type="number" id="height" placeholder="e.g. 170">
  <label>Weight (in kg):</label>
  <input type="number" id="weight" placeholder="e.g. 65">
  <button onclick="calcBMI()">Check Health Score</button>
  <div id="bmiResult"></div>

  <div class="related-section">
    <h3>📌 Related Tools & Options</h3>
    <a class="chip" href="salary-tax-calculator.html">💼 Salary & Tax Calculator</a>
    <a class="chip" href="yojana-search.html">🏛️ Yojana Search</a>
    <a class="chip" href="electricity-calculator.html">⚡ Electricity Bill Calculator</a>
  </div>

  <script>
    function calcBMI() {
      let h = parseFloat(document.getElementById('height').value)/100;
      let w = parseFloat(document.getElementById('weight').value);
      if(!h || !w) return;
      let bmi = (w / (h * h)).toFixed(1);
      let status = bmi < 18.5 ? "Underweight" : bmi < 24.9 ? "Healthy (Normal)" : "Overweight";
      document.getElementById('bmiResult').innerHTML = `
        <div class="card">
          <h3>BMI: ${bmi} (${status})</h3>
        </div>`;
    }
  </script>
</body>
</html>
