<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8.6 CGPA to Percentage - VTU Karnataka Calculator</title>
    <meta name="description" content="Convert 8.6 CGPA to percentage for VTU Karnataka. 8.6 CGPA is equal to 78.5%. Official formula: (CGPA - 0.75) * 10.">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 20px; background: #0f172a; color: #fff; margin:0; }
        .card { background: #1e293b; max-width: 550px; margin: 30px auto; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 22px; }
        .result { font-size: 32px; font-weight: bold; color: #4ade80; margin: 15px 0; background: #0f172a; padding: 15px; border-radius: 8px; }
        input { width: 80%; padding: 10px; border-radius: 6px; border: 1px solid #38bdf8; background: #0f172a; color: #fff; font-size: 16px; margin: 10px 0; text-align: center; }
        .formula { font-size: 14px; color: #94a3b8; margin: 15px 0; }
        .links { margin-top: 20px; display: flex; justify-content: space-around; }
        a { color: #38bdf8; text-decoration: none; font-size: 14px; background: #0f172a; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; }
        footer { margin-top: 30px; font-size: 13px; color: #64748b; border-top: 1px solid #334155; padding-top: 15px; }
        footer a { background: none; border: none; padding: 0 8px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>VTU Karnataka CGPA Converter</h1>
        <p>Convert custom CGPA dynamically:</p>
        <input type="number" id="userCgpa" value="8.6" step="0.1" oninput="calculate()">
        <div class="result" id="resBox">78.5%</div>
        <p class="formula">Formula used: <code>Percentage = (CGPA - 0.75) * 10</code></p>
        <hr style="border-color:#334155; margin: 20px 0;">
        <p style="font-size: 14px; color: #cbd5e1;">Related Calculations:</p>
        <div class="links">
            <a href="vtu-karnataka-8.1-cgpa-to-percentage.html">← 8.1 CGPA</a>
            <a href="index.html">Home</a>
            <a href="vtu-karnataka-9.1-cgpa-to-percentage.html">9.1 CGPA →</a>
        </div>
        <footer>
            <a href="privacy-policy.html">Privacy Policy</a> | 
            <a href="terms.html">Terms</a> | 
            <a href="about.html">About & Contact</a>
        </footer>
    </div>
    <script>
        function calculate() {
            let val = parseFloat(document.getElementById('userCgpa').value);
            if(!isNaN(val)) {
                document.getElementById('resBox').innerText = (Math.round((val - 0.75) * 10 * 100) / 100) + '%';
            }
        }
    </script>
</body>
</html>
